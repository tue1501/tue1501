name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Render a snake that stays on the contribution grid
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: |
          gh api graphql -f query='query($login: String!) { user(login: $login) { contributionsCollection { contributionCalendar { weeks { contributionDays { weekday contributionCount } } } } } }' -f login="$PROFILE_OWNER" > calendar.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('calendar.json').read_text())
          weeks = data['data']['user']['contributionsCollection']['contributionCalendar']['weeks']
          cells = {(x, day['weekday']): day['contributionCount']
                   for x, week in enumerate(weeks) for day in week['contributionDays']}
          from collections import deque

          body_size = 5
          start = min(cells, key=lambda cell: (-cell[0], abs(cell[1] - 3)))
          route = [start]
          pending = {cell for cell, count in cells.items() if count > 0}
          eaten = {}
          if start in pending:
              eaten[start] = 0
              pending.remove(start)

          while pending:
              head = route[-1]
              blocked = set(route[-body_size:-1])
              queue = deque([head])
              previous = {head: None}
              target = None
              while queue:
                  x, y = queue.popleft()
                  if (x, y) in pending:
                      target = (x, y)
                      break
                  for neighbor in ((x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)):
                      if neighbor in cells and neighbor not in blocked and neighbor not in previous:
                          previous[neighbor] = (x, y)
                          queue.append(neighbor)
              if target is None:
                  # Move the tail if it blocks access to the remaining food.
                  x, y = head
                  exits = [(x + dx, y + dy) for dx, dy in ((-1, 0), (1, 0), (0, -1), (0, 1))]
                  exits = [cell for cell in exits if cell in cells and cell not in blocked]
                  if not exits or len(route) >= len(cells) * 4:
                      break
                  route.append(min(exits, key=route.count))
                  continue
              path = []
              cursor = target
              while cursor != head:
                  path.append(cursor)
                  cursor = previous[cursor]
              route.extend(reversed(path))
              eaten[target] = len(route) - 1
              pending.remove(target)

          assert all(cell in cells for cell in route)
          assert all(abs(a[0] - b[0]) + abs(a[1] - b[1]) == 1 for a, b in zip(route, route[1:]))
          assert all(cell not in route[max(0, i - body_size + 1):i] for i, cell in enumerate(route))
          step, pad = 15, 6
          width, height = len(weeks) * step + 2 * pad - 3, 7 * step + 2 * pad - 3
          ticks = max(1, len(route) - 1) + body_size - 1
          duration = max(5, ticks * 0.145 / 0.88)
          dest = Path('dist')
          dest.mkdir(exist_ok=True)

          def render(filename, colors, tones):
              styles = ['@keyframes fade{0%{opacity:0}3%,91%{opacity:1}97%,100%{opacity:0}}',
                        '@media(prefers-reduced-motion:reduce){.snake,.food-reset{display:none}}']
              parts = [f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {width} {height}" role="img">',
                       '<title>Con sâu tìm các ô đóng góp của tue1501</title>']
              tiles = []
              for (x, y), count in cells.items():
                  level = sum(count >= boundary for boundary in (1, 3, 6, 10))
                  shape = f'x="{pad + x * step}" y="{pad + y * step}" width="12" height="12" rx="2"'
                  tiles.append(f'<rect {shape} fill="{colors[level]}"/>')
                  if (x, y) in eaten:
                      n = eaten[x, y]
                      threshold = 3 + 85 * n / ticks
                      name = f'eat{x}_{y}'
                      styles.append(f'@keyframes {name}{{0%,{threshold:.5f}%{{opacity:0}}{threshold + 0.001:.5f}%,100%{{opacity:1}}}}')
                      tiles.append(f'<rect class="food-reset" {shape} fill="{colors[0]}" style="animation:{name} {duration:.3f}s linear infinite"/>')
              segments = []
              for index, color in reversed(list(enumerate(tones))):
                  frames = []
                  for tick in range(ticks + 1):
                      x, y = route[min(len(route) - 1, max(0, tick - index))]
                      frames.append(f'{3 + 85 * tick / ticks:.5f}%{{transform:translate({pad + x * step}px,{pad + y * step}px)}}')
                  styles.append(f'@keyframes travel{index}{{{"".join(frames)}}}')
                  size = 11 if index == 0 else 10 - index // 2
                  offset = (12 - size) / 2
                  segments.append(f'<g style="animation:travel{index} {duration:.3f}s linear infinite">'
                                  f'<rect x="{offset}" y="{offset}" width="{size}" height="{size}" rx="3" fill="{color}"/></g>')
              parts.extend(['<style>' + ''.join(styles) + '</style>', *tiles,
                            f'<g class="snake" style="animation:fade {duration:.3f}s linear infinite">',
                            *segments, '</g>', '</svg>'])
              (dest / filename).write_text('\n'.join(parts), encoding='utf-8')

          render('contribution-snake-grid.svg', ('#ebedf0', '#9be9a8', '#40c463', '#30a14e', '#216e39'),
                 ('#6929d4', '#7c3aed', '#8b5cf6', '#a78bfa', '#c4b5fd'))
          render('contribution-snake-grid-dark.svg', ('#161b22', '#0e4429', '#006d32', '#26a641', '#39d353'),
                 ('#e9d5ff', '#d8b4fe', '#c084fc', '#a855f7', '#9333ea'))
          print(f'Validated {len(route) - 1} adjacent moves and ate {len(eaten)} of {len(eaten) + len(pending)} contribution cells.')
          PY
      - name: Publish SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
