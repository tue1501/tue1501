name: Contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: '23 0 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/contribution-snake.yml']

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake.svg?color_snake=%237c3aed
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=%23c4b5fd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SVG files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
